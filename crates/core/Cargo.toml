[package]
name = "baserust-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "baserust 的核心:共享内核 + 领域模型 / 端口 / 用例 + 内存适配器。不依赖任何 web / 数据库 / 消息框架。"
publish = false

# **依赖白名单**:只许纯库。加 web / 数据库 / 消息 / 对象存储 / JWT 依赖会让 tests/architecture.rs 变红 ——
# 那类代码属于主 crate 的适配器。
[dependencies]
idm = { workspace = true }
content = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
garde = { version = "0.23", features = ["derive", "email"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
