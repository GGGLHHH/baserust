# mock 样本数据(**dev/demo 专用**,非 prod 种子)。幂等写入 app 的 widget / profile 仓储。
# owner 用 username 引用 seed.toml 里的账号(apply 时经 idm 解析成用户 id;标识引用、非 FK)。
# 改样本数据编辑这里,不动代码。设 MOCK_FILE 可指向外部文件覆盖。
# 经典 ownership 矩阵:admin 拥 2 个 widget、user 拥 1 个 —— 演示 own-vs-all。

[[widgets]]
name = "admin-w1"
owner = "admin"

[[widgets]]
name = "admin-w2"
owner = "admin"

[[widgets]]
name = "user-w1"
owner = "user"

# 样本 profile(1:1 user)。跟在 seed 的初始 profile 之后跑、直接 upsert 覆盖它 —— demo 数据
# (带 phone、像样的名字)优先于 seed 的 display_name。**不撞 404 不再靠这里**:`/profiles/me`
# 资料未建时回空资料(见 profile::ProfileService::get_or_empty),这几行现在纯粹是样本内容。
[[profiles]]
owner = "superadmin"
display_name = "Sam Superadmin"
phone = "13800000000"

[[profiles]]
owner = "admin"
display_name = "Ada Admin"
phone = "13800000001"

[[profiles]]
owner = "user"
display_name = "Uma User"
phone = "13800000002"

# 演示平台管理员(2026-11-26 角色补充;非 prod 才有):能管组织和普通账号,看不到「系统监控」「登录日志」,
# 也碰不到 superadmin / 别的平台管理员。格式同 seed.toml 的 [[users]];superadmin 不许写在这里(只能有一个)。
[[users]]
username = "platform_admin"
password = "pwd"
platform_roles = ["platform_admin"]

[[profiles]]
owner = "platform_admin"
display_name = "Pat Platform"

# 演示租户(本地试「切换租户」用;非 prod 才有)。账号来自 seed.toml:
# admin 在默认租户是 admin、在演示组织是 user;user 反过来 —— 两个人都能在两个租户之间切换。
[[tenants]]
slug = "demo"
name = "演示组织"

[[members]]
username = "admin"
tenant = "demo"
roles = ["user"]

[[members]]
username = "user"
tenant = "demo"
roles = ["admin"]
