# idm 默认**租户 + 账号**(实例数据 + 密码)。`just seed` / 进程内 seed 读它幂等写进 idm。
# `SEED_FILE` 可指外部文件覆盖(prod 换真账号/密码)。
#
# 角色集 / 权限集 / role→权限默认 **不在这里** —— 它们是代码闭集(crates/core/src/kernel/authorization.rs 的
# `RoleName` / `Permission`,不做动态 CRUD)。role→权限的运行期改动落 app schema 的 `role_permissions` 表。
#
# 角色分两类(`RoleName::scope()`):
#   - 平台角色:写 `platform_roles`,跨租户。
#       superadmin     —— 超级管理员,**只能有一个**、只能在这里声明(任何接口都授不出 / 撤不掉;声明给多个账号、
#                         或库里已有别的账号是 superadmin → 启动 / seed 报错)。独占:系统监控、登录日志、任命 / 撤销平台管理员,
#                         它自己的账号也只有它本人能改。
#       platform_admin —— 平台管理员,可以有多个(这里声明,或由 superadmin 在后台「账号」页任命)。能管组织
#                         (开、停、改名、指定成员与组织管理员)和普通账号(建号、重置密码、删除),看不到监控 / 登录日志,
#                         碰不到持平台角色的账号;看组织业务数据仍要先成为该组织成员。
#   - 租户角色(admin / user):写 `tenants = [{ slug, roles }]`,只在那个租户里生效。
# 写错位置 / 拼错角色名,启动 / 测试即挂。
#
# 幂等:租户按固定 id / slug upsert;账号已存在不动密码;平台角色、成员关系、租户角色按声明**补齐**(取并集,
# 不清运行期授予的)。补齐前若已存在的账号缺声明的东西,先用这里的 password 核对它的密码:对不上(被人抢注了用户名,
# 或运行期改过密码后又被撤了权)→ 日志警告并跳过这个账号的补授,不拦启动。`display_name` 可选:建号时连带建初始 profile(app schema),只在首建时写。

# 默认租户:slug = "default" 时 id 固定为 00000000-0000-0000-0000-000000000001(迁移把存量数据都归到它)。
[[tenants]]
slug = "default"
name = "默认组织"

[[users]]
username = "superadmin"
email = "superadmin@local" # 可选;登录用 username 或 email 都行
password = "pwd"
platform_roles = ["superadmin"]
# 平台角色不自动获得租户里的权限:超管在默认租户兼任 admin,才能用后台和业务页面。
tenants = [{ slug = "default", roles = ["admin"] }]
display_name = "Super Admin"

[[users]]
username = "admin"
password = "pwd"
tenants = [{ slug = "default", roles = ["admin"] }]
display_name = "Admin"

[[users]]
username = "user"
password = "pwd"
tenants = [{ slug = "default", roles = ["user"] }]
